$kind: http-request
name: GET /health (200)
url: "{{base_url}}/health"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: >-
      pm.test('status 200', () => pm.response.to.have.status(200));

      pm.test('body.status == ok', () => { const json = pm.response.json();
      pm.expect(json).to.have.property('status', 'ok'); });
    language: text/javascript
order: 1000

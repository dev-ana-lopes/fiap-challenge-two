$kind: http-request
name: GET /public/service-orders/{{service_order_id}}/approval invalid token (400)
url: "{{base_url}}/public/service-orders/{{service_order_id}}/approval?token=in\
  valid-token"
method: GET
queryParams:
  token: invalid-token
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      eval(pm.globals.get('qa_guard_required_uuid'));
      qaGuardRequiredUuid('service_order_id');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      eval(pm.globals.get('qa_parse_json'));
      const json = qaParseJson();
      pm.test('has detail', () => pm.expect(json).to.have.property('detail'));
    language: text/javascript
order: 4000

$kind: http-request
name: GET
  /public/service-orders/{{service_order_id}}/approval?token={{approval_email_token}}
  (200)
url: "{{base_url}}/public/service-orders/{{service_order_id}}/approval?token={{\
  approval_email_token}}"
method: GET
queryParams:
  token: "{{approval_email_token}}"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: >-
      eval(pm.globals.get('qa_guard_required_uuid'));

      qaGuardRequiredUuid('service_order_id');

      pm.test('approval_email_token is populated', function () {
      pm.expect((pm.environment.get('approval_email_token') ||
      '').trim()).to.not.equal(''); });
    language: text/javascript
  - type: afterResponse
    code: >-
      pm.test('status 200', () => pm.response.to.have.status(200));

      eval(pm.globals.get('qa_parse_json'));

      const json = qaParseJson();

      pm.test('success true', () => pm.expect(json).to.have.property('success',
      true));

      pm.test('has final status', () =>
      pm.expect(json).to.have.property('status'));

      pm.test('has decision', () =>
      pm.expect(json).to.have.property('decision'));
    language: text/javascript
order: 3000

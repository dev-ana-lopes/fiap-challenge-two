$kind: http-request
name: PUT /vehicles/{{vehicle_id}} (200)
url: "{{base_url}}/vehicles/{{vehicle_id}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "customer_id": "{{customer_id_customers_crud}}",
      "brand": "Toyota",
      "model": "Corolla Altis",
      "year": 2021,
      "plate": "BRA2A34"
    }
scripts:
  - type: beforeRequest
    code: |-
      eval(pm.globals.get('qa_guard_required_uuid'));
      qaGuardRequiredUuid('vehicle_id');
    language: text/javascript
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 7000

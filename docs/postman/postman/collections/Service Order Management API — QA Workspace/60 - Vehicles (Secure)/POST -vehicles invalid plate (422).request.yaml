$kind: http-request
name: POST /vehicles invalid plate (422)
url: "{{base_url}}/vehicles"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "customer_id": "{{customer_id_customers_crud}}",
      "brand": "Toyota",
      "model": "Yaris",
      "year": 2021,
      "plate": "INVALID"
    }
scripts:
  - type: beforeRequest
    code: |-
      eval(pm.globals.get('qa_guard_required_uuid'));
      qaGuardRequiredUuid('customer_id_customers_crud');
    language: text/javascript
  - type: afterResponse
    code: pm.test('status 422', () => pm.response.to.have.status(422));
    language: text/javascript
order: 2000

$kind: http-request
name: GET /vehicles/{{vehicle_id}} (200)
url: "{{base_url}}/vehicles/{{vehicle_id}}"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      eval(pm.globals.get('qa_guard_required_uuid'));
      qaGuardRequiredUuid('vehicle_id');
      qaGuardRequiredUuid('customer_id_customers_crud');
    language: text/javascript
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000

$kind: http-request
name: POST /service-orders/{{nonexistent_uuid}}/approval (404)
url: "{{base_url}}/service-orders/00000000-0000-0000-0000-000000000000/approval"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "approved": true
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test('status 404', () => pm.response.to.have.status(404));

      pm.test('has detail', () =>
      pm.expect(pm.response.json()).to.have.property('detail'));
    language: text/javascript
order: 14000

$kind: http-request
name: POST /service-orders invalid plate (422)
url: "{{base_url}}/service-orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "customer_name": "QA Invalid Plate",
      "customer_cpf_cnpj": null,
      "customer_email": "{{service_order_customer_email}}",
      "customer_phone": "11999999995",
      "vehicle_brand": "Ford",
      "vehicle_model": "Focus",
      "vehicle_year": 2020,
      "vehicle_plate": "INVALID",
      "services": [
        {"description": "Inspection", "price": 10.0}
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test('status 422', () => pm.response.to.have.status(422));
    language: text/javascript
order: 7000

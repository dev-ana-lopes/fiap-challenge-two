$kind: http-request
name: GET /service-orders (401) invalid token
url: "{{base_url}}/service-orders"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{invalid_access_token}}"
scripts:
  - type: afterResponse
    code: pm.test('status 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 2000

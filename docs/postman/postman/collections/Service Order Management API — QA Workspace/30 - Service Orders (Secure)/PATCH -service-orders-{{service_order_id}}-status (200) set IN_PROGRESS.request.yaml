$kind: http-request
name: PATCH /service-orders/{{service_order_id}}/status (200) set IN_PROGRESS
url: "{{base_url}}/service-orders/{{service_order_id}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "IN_PROGRESS"
    }
scripts:
  - type: beforeRequest
    code: |-
      eval(pm.globals.get('qa_guard_required_uuid'));
      qaGuardRequiredUuid('service_order_id');
    language: text/javascript
  - type: afterResponse
    code: >-
      pm.test('status 200', () => pm.response.to.have.status(200));

      eval(pm.globals.get('qa_parse_json'));

      const json = qaParseJson();

      pm.test('success true', () => pm.expect(json).to.have.property('success',
      true));
    language: text/javascript
order: 15000

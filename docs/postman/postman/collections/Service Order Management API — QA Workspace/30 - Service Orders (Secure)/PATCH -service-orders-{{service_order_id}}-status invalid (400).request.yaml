$kind: http-request
name: PATCH /service-orders/{{service_order_id}}/status invalid (400)
url: "{{base_url}}/service-orders/{{service_order_id}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "NOT_A_STATUS"
    }
scripts:
  - type: beforeRequest
    code: |-
      eval(pm.globals.get('qa_guard_required_uuid'));
      qaGuardRequiredUuid('service_order_id');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      eval(pm.globals.get('qa_parse_json'));
      const json = qaParseJson();
      pm.test('has detail', () => pm.expect(json).to.have.property('detail'));
    language: text/javascript
order: 16000

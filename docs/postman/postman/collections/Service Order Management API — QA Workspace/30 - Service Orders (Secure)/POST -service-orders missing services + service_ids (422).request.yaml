$kind: http-request
name: POST /service-orders missing services + service_ids (422)
url: "{{base_url}}/service-orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "customer_name": "QA Missing",
      "customer_cpf_cnpj": null,
      "customer_email": "{{service_order_customer_email}}",
      "customer_phone": "11999999996",
      "vehicle_brand": "Ford",
      "vehicle_model": "Ka",
      "vehicle_year": 2019,
      "vehicle_plate": "BRA1D23"
    }
scripts:
  - type: afterResponse
    code: pm.test('status 422', () => pm.response.to.have.status(422));
    language: text/javascript
order: 6000

$kind: http-request
name: PUT /catalog/parts/{{inventory_part_id}} (200)
url: "{{base_url}}/catalog/parts/{{inventory_part_id}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Air filter (QA updated)",
      "unit_price": 60.0,
      "stock_quantity": 5
    }
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000

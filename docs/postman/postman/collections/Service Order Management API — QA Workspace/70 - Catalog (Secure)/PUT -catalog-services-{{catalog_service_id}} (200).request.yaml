$kind: http-request
name: PUT /catalog/services/{{catalog_service_id}} (200)
url: "{{base_url}}/catalog/services/{{catalog_service_id}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "description": "Oil change (QA updated)",
      "price": 120.0
    }
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000

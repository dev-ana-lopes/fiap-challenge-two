$kind: http-request
name: PUT /customers/{{customer_id_customers_crud}} (200)
url: "{{base_url}}/customers/{{customer_id_customers_crud}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Customer QA Updated",
      "cpf_cnpj": "04.252.011/0001-10",
      "email": "{{customer_crud_updated_email}}",
      "phone": "11911113333"
    }
scripts:
  - type: beforeRequest
    code: pm.variables.set('timestamp', String(Date.now()));
    language: text/javascript
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000

$kind: http-request
name: GET /metrics/average-execution-time (200; can be null)
url: "{{base_url}}/metrics/average-execution-time"
method: GET
scripts:
  - type: afterResponse
    code: >-
      pm.test('status 200', () => pm.response.to.have.status(200));

      const json = pm.response.json();

      pm.test('has average_execution_time_seconds', () =>
      pm.expect(json).to.have.property('average_execution_time_seconds'));
    language: text/javascript
order: 1000

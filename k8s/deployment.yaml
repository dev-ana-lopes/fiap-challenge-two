apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-order-api
  labels:
    app: service-order-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-order-api
  template:
    metadata:
      labels:
        app: service-order-api
    spec:
      containers:
        - name: api
          image: ${API_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: service-order-api-config
            - secretRef:
                name: service-order-api-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

name: ci-cd-ec2-local

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  APP_DIR: /opt/service-order-api

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Poetry
        run: pip install poetry==1.7.0

      - name: Install dependencies
        run: poetry install

      - name: Lint
        run: |
          poetry run black --check src tests
          poetry run isort --check-only src tests
          poetry run flake8 src tests

      - name: Test with coverage
        run: |
          poetry run pytest --cov=src --cov-report=term-missing --cov-report=xml

  deploy-production:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, prod]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure app directory exists
        run: |
          mkdir -p "${{ env.APP_DIR }}"

      - name: Render production env
        run: |
          printf '%s' "${{ secrets.APP_ENV_PROD }}" > "${{ env.APP_DIR }}/.env.prod"

      - name: Sync files to app dir
        run: |
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            ./ "${{ env.APP_DIR }}/"

      - name: Verify env file
        working-directory: ${{ env.APP_DIR }}
        run: |
          test -f .env.prod
          grep -q '^DATABASE_URL=' .env.prod
          grep -q '^APP_BASE_URL=' .env.prod
          grep -q '^CORS_ALLOWED_ORIGINS=' .env.prod
          grep -q '^TRUSTED_HOSTS=' .env.prod

      - name: Build image locally
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker build -t service-order-api:${GITHUB_SHA} .

      - name: Run migrations
        working-directory: ${{ env.APP_DIR }}
        run: |
          API_IMAGE=service-order-api:${GITHUB_SHA} \
          docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm migrate

      - name: Start application
        working-directory: ${{ env.APP_DIR }}
        run: |
          API_IMAGE=service-order-api:${GITHUB_SHA} \
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans

      - name: Healthcheck
        run: |
          curl -f http://localhost:8000/health/ready

      - name: Show running containers
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker ps -a
          docker compose --env-file .env.prod -f docker-compose.prod.yml logs --tail=100 || true
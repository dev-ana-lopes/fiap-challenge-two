name: ci-cd

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Publicar imagem no registry"
        required: true
        default: false
        type: boolean
      deploy_environment:
        description: "Ambiente de deploy"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - staging
          - production

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "1.7.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install

      - name: Lint
        run: |
          poetry run black --check src tests
          poetry run isort --check-only src tests
          poetry run flake8 src tests

      - name: Test with coverage
        run: poetry run pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build-image:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          IMAGE_NAME="service-order-api"
          IMAGE_TAG="${GITHUB_SHA}"
          echo "image_name=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build image
        run: docker build -t "${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}" .

  publish-image:
    runs-on: ubuntu-latest
    needs: build-image
    if: >
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_image == true)
      ) &&
      secrets.AWS_ACCESS_KEY_ID != '' &&
      secrets.AWS_SECRET_ACCESS_KEY != '' &&
      secrets.AWS_REGION != '' &&
      secrets.ECR_REGISTRY != '' &&
      secrets.ECR_REPOSITORY != ''
    outputs:
      image_uri: ${{ steps.publish.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: publish
        shell: bash
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

  deploy-ec2:
    runs-on: ubuntu-latest
    needs:
      - validate
      - publish-image
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_environment != 'none' &&
      needs.publish-image.result == 'success' &&
      secrets.EC2_HOST != '' &&
      secrets.EC2_USER != '' &&
      secrets.EC2_SSH_PRIVATE_KEY != '' &&
      secrets.APP_ENV_PROD != ''
    environment: ${{ inputs.deploy_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Trust EC2 host
        shell: bash
        run: ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Render production env file
        shell: bash
        run: printf '%s' "${{ secrets.APP_ENV_PROD }}" > .env.prod

      - name: Upload deployment bundle
        shell: bash
        run: |
          scp docker-compose.prod.yml "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/service-order-api/docker-compose.prod.yml"
          scp .env.prod "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/service-order-api/.env.prod"
          scp scripts/deploy/release.sh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/service-order-api/scripts-release.sh"

      - name: Deploy on EC2
        shell: bash
        env:
          IMAGE_URI: ${{ needs.publish-image.outputs.image_uri }}
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "chmod +x /opt/service-order-api/scripts-release.sh && \
             cd /opt/service-order-api && \
             API_IMAGE='${IMAGE_URI}' APP_DIR='/opt/service-order-api' ENV_FILE='.env.prod' COMPOSE_FILE='docker-compose.prod.yml' ./scripts-release.sh"

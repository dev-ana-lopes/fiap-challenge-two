name: ci-cd-ec2-local

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  APP_DIR: /opt/service-order-api
  COMPOSE_FILE: docker-compose.prod.yml
  COMPOSE_PROJECT_NAME: service-order-prod
  API_IMAGE_NAME: service-order-api
  APP_HEALTH_URL: http://localhost:8000/health/ready

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: uv

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: |
          uv run black --check src tests
          uv run isort --check-only src tests
          uv run flake8 src tests

      - name: Test with coverage
        run: |
          uv run pytest --cov=src --cov-report=term-missing --cov-report=xml

  deploy-production:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, prod]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure app directory exists
        run: mkdir -p "${{ env.APP_DIR }}"

      - name: Sync files to app dir
        run: |
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude '.env.prod' \
            ./ "${{ env.APP_DIR }}/"

      - name: Render production env
        run: |
          printf '%s' "${{ secrets.APP_ENV_PROD }}" > "${{ env.APP_DIR }}/.env.prod"

      - name: Prepare production env
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          python3 scripts/deploy/prepare_env.py .env.prod

      - name: Prepare rollback tags
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          if docker image inspect ${{ env.API_IMAGE_NAME }}:prod-current >/dev/null 2>&1; then
            docker tag ${{ env.API_IMAGE_NAME }}:prod-current ${{ env.API_IMAGE_NAME }}:prod-previous
          fi

      - name: Build image locally
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          docker build -t ${{ env.API_IMAGE_NAME }}:${GITHUB_SHA} .
          docker tag ${{ env.API_IMAGE_NAME }}:${GITHUB_SHA} ${{ env.API_IMAGE_NAME }}:prod-current

      - name: Pre-deploy diagnostics
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker ps -a --format 'table {{.ID}}\t{{.Names}}\t{{.Ports}}\t{{.Status}}'
          echo
          ss -ltnp | grep ':8000' || true
          echo
          docker compose -p "${{ env.COMPOSE_PROJECT_NAME }}" --env-file .env.prod -f "${{ env.COMPOSE_FILE }}" ps || true

      - name: Cleanup previous compose state
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          docker compose -p "${{ env.COMPOSE_PROJECT_NAME }}" --env-file .env.prod -f "${{ env.COMPOSE_FILE }}" down --remove-orphans || true

      - name: Remove legacy containers that may hold port 8000
        run: |
          set -euo pipefail

          for name in service-order-api-prod service-order-migrate-prod service-order-api-api-1; do
            if docker ps -a --format '{{.Names}}' | grep -Fxq "$name"; then
              docker rm -f "$name" || true
            fi
          done

          PORT_CONTAINERS="$(docker ps -q --filter publish=8000 || true)"
          if [ -n "${PORT_CONTAINERS}" ]; then
            docker rm -f ${PORT_CONTAINERS} || true
          fi

      - name: Fail fast if port 8000 is still busy
        run: |
          set -euo pipefail
          if ss -ltn '( sport = :8000 )' | grep -q ':8000'; then
            echo "::error::Port 8000 is still in use before startup."
            ss -ltnp | grep ':8000' || true
            docker ps -a --format 'table {{.ID}}\t{{.Names}}\t{{.Ports}}\t{{.Status}}'
            exit 1
          fi

      - name: Run migrations
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          API_IMAGE=${{ env.API_IMAGE_NAME }}:${GITHUB_SHA} \
          APP_ENV_FILE=.env.prod \
          docker compose -p "${{ env.COMPOSE_PROJECT_NAME }}" --env-file .env.prod -f "${{ env.COMPOSE_FILE }}" run --rm migrate

      - name: Start application
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          API_IMAGE=${{ env.API_IMAGE_NAME }}:${GITHUB_SHA} \
          APP_ENV_FILE=.env.prod \
          docker compose -p "${{ env.COMPOSE_PROJECT_NAME }}" --env-file .env.prod -f "${{ env.COMPOSE_FILE }}" up -d --remove-orphans api

      - name: Wait for Docker healthcheck
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail

          CONTAINER_ID="$(docker compose -p "${{ env.COMPOSE_PROJECT_NAME }}" --env-file .env.prod -f "${{ env.COMPOSE_FILE }}" ps -q api)"
          if [ -z "${CONTAINER_ID}" ]; then
            echo "::error::API container was not created."
            docker compose -p "${{ env.COMPOSE_PROJECT_NAME }}" --env-file .env.prod -f "${{ env.COMPOSE_FILE }}" ps || true
            exit 1
          fi

          echo "Container ID: ${CONTAINER_ID}"

          for i in $(seq 1 24); do
            STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${CONTAINER_ID}" 2>/dev/null || true)"
            echo "Attempt ${i}/24 - status: ${STATUS}"

            if [ "${STATUS}" = "healthy" ]; then
              exit 0
            fi

            if [ "${STATUS}" = "unhealthy" ] || [ "${STATUS}" = "exited" ] || [ "${STATUS}" = "dead" ]; then
              echo "::error::Container became ${STATUS}."
              docker logs "${CONTAINER_ID}" || true
              docker inspect "${CONTAINER_ID}" || true
              exit 1
            fi

            sleep 5
          done

          echo "::error::Container did not become healthy in time."
          docker logs "${CONTAINER_ID}" || true
          docker inspect "${CONTAINER_ID}" || true
          exit 1

      - name: External healthcheck with retry
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            echo "External healthcheck attempt ${i}/12"
            if curl -fsS "${{ env.APP_HEALTH_URL }}" >/dev/null; then
              echo "External healthcheck succeeded."
              exit 0
            fi
            sleep 5
          done
          echo "::error::External healthcheck failed after retries."
          exit 1

      - name: Rollback on failure
        if: failure()
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail

          echo "Deployment failed. Attempting rollback..."
          docker compose -p "${{ env.COMPOSE_PROJECT_NAME }}" --env-file .env.prod -f "${{ env.COMPOSE_FILE }}" down --remove-orphans || true

          if docker image inspect ${{ env.API_IMAGE_NAME }}:prod-previous >/dev/null 2>&1; then
            API_IMAGE=${{ env.API_IMAGE_NAME }}:prod-previous \
            APP_ENV_FILE=.env.prod \
            docker compose -p "${{ env.COMPOSE_PROJECT_NAME }}" --env-file .env.prod -f "${{ env.COMPOSE_FILE }}" up -d --remove-orphans api
          else
            echo "::warning::No prod-previous image available for rollback."
          fi

      - name: Show running containers and logs
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "== docker ps -a =="
          docker ps -a
          echo
          echo "== compose ps =="
          docker compose -p "${{ env.COMPOSE_PROJECT_NAME }}" --env-file .env.prod -f "${{ env.COMPOSE_FILE }}" ps || true
          echo
          echo "== compose logs =="
          docker compose -p "${{ env.COMPOSE_PROJECT_NAME }}" --env-file .env.prod -f "${{ env.COMPOSE_FILE }}" logs --tail=200 || true
          echo
          echo "== port 8000 usage =="
          ss -ltnp | grep ':8000' || true

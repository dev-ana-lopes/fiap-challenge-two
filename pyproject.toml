[tool.poetry]
name = "service-order-api"
version = "1.0.0"
description = "Service Order Management API for mechanical workshop system"
authors = ["Ana Lopes <dev.anajulia@outlook.com.br>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {version = "^0.24.0", extras = ["standard"]}
sqlalchemy = "^2.0.23"
psycopg = {version = "^3.1.13", extras = ["binary"]}
alembic = "^1.12.1"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
passlib = "^1.7.4"
email-validator = "^2.1.0"
python-multipart = "^0.0.6"
asyncpg = "^0.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^23.12.0"
flake8 = "^6.1.0"
isort = "^5.13.2"
httpx = "^0.25.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 89
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 89

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end API and email workflow tests",
    "integration: tests that exercise external integrations",
    "mailhog: local end-to-end tests against MailHog and a running stack",
    "testmail: live tests that query the Testmail API",
]

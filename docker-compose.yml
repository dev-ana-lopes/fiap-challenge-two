services:
  api:
    build: .
    container_name: service-order-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_BASE_URL: ${APP_BASE_URL}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: "false"
      SMTP_USE_AUTH: "false"
      APPROVAL_TOKEN_SECRET: ${APPROVAL_TOKEN_SECRET}
      APPROVAL_TOKEN_TTL_MINUTES: ${APPROVAL_TOKEN_TTL_MINUTES}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      MIGRATE_ON_STARTUP: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - service-order-network
    volumes:
      - .:/app

  postgres:
    image: postgres:16-alpine
    container_name: service-order-postgres
    environment:
      POSTGRES_DB: service_order_db
      POSTGRES_USER: service_order_user
      POSTGRES_PASSWORD: service_order_password
    ports:
      - "5432:5432"
    networks:
      - service-order-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_order_user -d service_order_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: service-order-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - service-order-network

volumes:
  postgres_data:

networks:
  service-order-network:
    driver: bridge

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-order-migrate-prod
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_BASE_URL: ${APP_BASE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      SMTP_USE_AUTH: ${SMTP_USE_AUTH}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      APPROVAL_TOKEN_SECRET: ${APPROVAL_TOKEN_SECRET}
      APPROVAL_TOKEN_TTL_MINUTES: ${APPROVAL_TOKEN_TTL_MINUTES}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      MIGRATE_ON_STARTUP: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - service-order-network
    command: ["poetry", "run", "alembic", "-c", "alembic/alembic.ini", "upgrade", "head"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-order-api-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_BASE_URL: ${APP_BASE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      SMTP_USE_AUTH: ${SMTP_USE_AUTH}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      APPROVAL_TOKEN_SECRET: ${APPROVAL_TOKEN_SECRET}
      APPROVAL_TOKEN_TTL_MINUTES: ${APPROVAL_TOKEN_TTL_MINUTES}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      MIGRATE_ON_STARTUP: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - service-order-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: service-order-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-service_order_db}
      POSTGRES_USER: ${POSTGRES_USER:-service_order_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-service_order_password}
    ports:
      - "5432:5432"
    networks:
      - service-order-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-service_order_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local

networks:
  service-order-network:
    driver: bridge

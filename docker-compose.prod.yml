services:
  migrate:
    image: ${API_IMAGE:?API_IMAGE must point to the published ECR image}
    pull_policy: always
    container_name: service-order-migrate-prod
    restart: "no"
    environment: &api_environment
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_AUTH: ${SMTP_USE_AUTH:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      APPROVAL_TOKEN_SECRET: ${APPROVAL_TOKEN_SECRET:?APPROVAL_TOKEN_SECRET is required}
      APPROVAL_TOKEN_TTL_MINUTES: ${APPROVAL_TOKEN_TTL_MINUTES:-60}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      MIGRATE_ON_STARTUP: "false"
    networks:
      - service-order-network
    command: ["alembic", "-c", "alembic/alembic.ini", "upgrade", "head"]

  api:
    image: ${API_IMAGE:?API_IMAGE must point to the published ECR image}
    pull_policy: always
    container_name: service-order-api-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      <<: *api_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - service-order-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  service-order-network:
    driver: bridge
